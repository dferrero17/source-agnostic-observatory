abstract: >
  We operated LLM-generated extraction wrappers as live infrastructure for a smart city
  observatory for 149 days, and report what that yields rather than a new mechanism. A
  non-technical user registers a source and its metadata through a form; the platform then
  writes, runs, and maintains the extraction code itself for sources in three families
  (REST APIs, spreadsheets, CSV files), each mapped to one normalized (timestamp, value)
  series. We read each wrapper as a self-managing component through the autonomic MAPE-K
  lens, with a large language model as the actuator that writes the wrapper's code and
  rewrites it from the crash trace; the repair loop itself restates established LLM program
  repair and is not our contribution. Over 149 days the platform stood up 396 wrappers and
  gathered 164,322 measurements; 284 of 396 ever produced data, so cheap intake widens what
  can be attempted without by itself yielding live indicators. Of the 43 (10.9%) that
  crashed, repair restored execution for all but one at a median 33.4 s (unchanged when the
  one correlated mass-relaunch is set aside); recovery here means a clean re-run, not
  validated values. Our contribution is the measured fault boundary: across 69 terminal
  errors the faults the loop governs coincide with the code the LLM owns, and the in-scope
  faults it left unrepaired number exactly one (itself quota-blocked), while quota,
  credential, and configuration faults lie outside it.
