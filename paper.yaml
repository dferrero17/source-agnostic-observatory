abstract: >
  A smart city observatory whose intake layer is built from LLM-generated data wrappers: a
  non-technical user registers a source through a form, and the platform writes, runs, and
  repairs the extraction code itself, mapping REST APIs, spreadsheets, and CSV files to a
  normalized (timestamp, value) series. We report 149 days in production, 396 wrappers and
  164,322 measurements. The binding failures turn out to be environmental, not bad code:
  almost all 69 terminal errors are watchdog kills of idle pollers or model-provider faults,
  while generated code the repair loop could not fix numbers exactly one. Cheap generation
  also decouples attempt from yield, only 284 of 396 wrappers ever produced data, and
  crash-triggered repair can mask faults as easily as fix them, so we down-scope "recovery"
  to restored execution. The autonomic MAPE-K loop and its LLM actuator are an organizing
  lens; the repair mechanism is established LLM program repair. What is new is the production
  evidence of where such a system actually breaks, and what that implies for running a civic
  observatory.
