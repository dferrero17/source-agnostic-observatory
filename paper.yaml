abstract: >
  A smart-city observatory whose intake layer is built from LLM-generated data wrappers: a
  non-technical user registers a source through a form, and the platform writes, runs, and
  repairs the extraction code itself, mapping REST APIs, spreadsheets, and CSV files to a
  normalized (timestamp, value) series. We report 149 days in production, 396 wrappers and
  164,322 measurements. The binding faults turn out to be environmental, not bad code: almost
  all 69 terminal errors are watchdog kills of long-cadence pollers or operational faults
  (spent quota, provider overload, a mid-generation restart), and the one error-status wrapper
  whose generated code went unrepaired had its repair blocked by that same quota. Cheap
  generation also decouples attempt from yield, only 284 of 396 wrappers ever produced data,
  most of the silent remainder deleted or never run rather than failed extractions; and
  crash-triggered repair can mask faults as easily as fix them, so we down-scope "recovery" to
  restored execution. The MAPE-K loop and its LLM actuator are an organizing lens and the
  repair mechanism is established program repair; what is new is production evidence of where
  such a system breaks in a civic observatory.
