abstract: >
  We describe a smart city observatory whose intake layer is built from LLM-generated data
  wrappers: a non-technical user registers a source and its metadata through a form, and the
  platform writes, runs, and maintains the extraction code itself for sources in three
  families (REST APIs, spreadsheets, CSV files), each mapped to a normalized (timestamp,
  value) series. We report 149 days of operating this in production, 396 wrappers and
  164,322 measurements, and three findings that hold across the run. First, the binding
  failures are not bad generated code but the environment around it: 54 of the 69 terminal
  errors are idle pollers killed by a watchdog set shorter than their cadence and 14 are
  model-quota or credential faults, while generated code the repair loop could not fix
  numbers exactly one (itself quota-blocked). Second, cheap generation decouples attempt
  from yield: only 284 of 396 wrappers ever produced data, so attempting a feed is nearly
  free but a live indicator is not. Third, crash-triggered LLM repair leans toward masking
  rather than fixing: three of four repaired cases recover by swallowing errors, and we
  down-scope "recovery" to restored execution because the snapshot cannot confirm the values
  are right. The autonomic MAPE-K loop and its LLM actuator are an organizing lens, not a
  contribution; the repair mechanism is established LLM program repair. What is new is the
  production evidence and what it says about where such a system actually breaks.
