abstract: >
  A smart-city observatory lives or dies by intake: every indicator needs a wrapper that pulls
  one series from one heterogeneous source and keeps pulling it as the source drifts. We report
  a 149-day production case study of an intake layer that removes the per-source code: a
  non-technical user registers a source through a form and the platform has an LLM write, run,
  and repair the extraction wrapper, mapping REST APIs, spreadsheets, and CSV files to a
  normalized (timestamp, value) series. Over 396 wrappers and 164,322 measurements, code faults
  were common (one wrapper in seven crashed at some point) but the repair loop absorbed nearly
  all it reached, and the faults that ended wrappers in a terminal error were operational: of
  69, 54 were kills by an execution watchdog set shorter than the feeds' polling period, 14
  failed at generation on quota, overload, or our own restarts, and one crash went unrepaired
  because the repair call hit the quota. Repair restored execution for 42 of the 43 wrappers it
  reached and resumed output for 32, but two of four inspected repairs recovered by swallowing
  an upstream error, so recovery is scored as resumed output and value correctness treated as
  open; a live re-extraction of eight public sources matched 84 of 95 stored values exactly, the
  rest upstream revisions. We close with the operational rules the deployment taught us.
