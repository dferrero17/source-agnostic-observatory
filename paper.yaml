abstract: >
  An urban observatory is worth as many indicators as it can take in, and that number is
  usually small: every feed arrives in its own shape and needs its own extraction code
  that someone writes and then keeps alive. We describe a smart city observatory in
  production whose intake layer removes the per-source coding. A non-technical user
  registers a source and its metadata through a form, and the platform writes, runs, and
  maintains the extraction code on its own for any source in three supported families
  (REST APIs, spreadsheets, CSV files), each mapped to one normalized (timestamp, value)
  series. Each source's wrapper is a self-managing component driven by one autonomic
  (MAPE-K) control loop whose actuator is a large language model: where a classical
  autonomic manager tunes a fixed component's parameters, this one writes and rewrites the
  component's code. The wrapper self-generates from metadata and a sample, self-deploys as
  a supervised checkpointed process, and self-heals from production crash traces. Over 149
  days the platform stood up 396 wrappers and gathered 164,322 measurements; of the 43
  (10.9%) that crashed and were auto-repaired, 39 ended in a healthy state and 32 resumed
  delivering data at a median 33.4 s per repair, and the stack fits in roughly 1.5 GiB.
  The pattern has a clear, bounded edge: format and code defects lie within the loop's
  reach, while quota, credential, and misconfiguration faults are environmental and lie
  beyond it.
